[workspace]
resolver = "3"
members = ["crates/lingua-serpentis", "crates/latinitas", "crates/liss-runtime", "crates/liss-ir", "crates/liss-codegen"]
# `liss-abi` is its own workspace (spec §9.1). Task 10's `build.rs` invokes
# cargo on it from inside a build of this workspace, and a member would
# contend for the outer `.cargo-lock`. Test it with
# `cargo test --manifest-path crates/liss-abi/Cargo.toml`.
exclude = ["crates/liss-abi"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
