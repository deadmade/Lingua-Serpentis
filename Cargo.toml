[workspace]
resolver = "3"
members = ["crates/lingua-serpentis", "crates/latinitas", "crates/runtime", "crates/ir", "crates/codegen", "crates/abi"]
# `abi` is a member like the rest, though `codegen/build.rs` cross-builds it
# from inside a build of this workspace: `docs/internals/abi.md`.

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
