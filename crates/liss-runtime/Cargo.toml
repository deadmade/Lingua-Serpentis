[package]
name = "liss-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "liss_runtime"
path = "src/lib.rs"

# Zero production dependencies, deliberately: this crate is compiled twice —
# once for the host inside the compiler (`liss-ir` needs `Roman` for integer
# constants), once for musl inside `liss-abi`'s staticlib — and both build
# graphs must stay simple. See spec §11.
[dependencies]

[dev-dependencies]
proptest = "1"
