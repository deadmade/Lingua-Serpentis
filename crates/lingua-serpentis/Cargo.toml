[package]
name = "lingua-serpentis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "lingua_serpentis"
path = "src/lib.rs"

# The compiling surface, and now the only one (spec §9.5). A shim over
# `cli::liss` — see that module for why the driver itself is a library module
# rather than living here.
#
# The `lingua-serpentis` binary is gone. §9.5 kept it "for this milestone"
# because `tests/cli.rs`'s twenty-three tests were the regression net for the
# whole pipeline; those tests point at `liss` now, so the reason is spent and
# what was left was an untested second CLI over deleted entry points.
[[bin]]
name = "liss"
path = "src/bin/liss.rs"

[dependencies]
latinitas = { path = "../latinitas" }
liss-ir = { path = "../liss-ir" }
liss-runtime = { path = "../liss-runtime" }
# The back end, as spec §9.1's diagram draws it. `liss-codegen` dev-depends on
# this crate for `tests/salve.rs`, so what remains is a **dev**-dependency
# cycle, which cargo permits and a normal one would not.
liss-codegen = { path = "../liss-codegen" }

[dev-dependencies]
insta = "1"
libtest-mimic = "0.8"
proptest = "1"

[[test]]
name = "conformance"
harness = false
