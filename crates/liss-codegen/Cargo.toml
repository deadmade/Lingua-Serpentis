[package]
name = "liss-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Spec §11's list, and nothing outside it. Cranelift emits the object;
# `cranelift-object` writes it; `libwild` links it in process. `target-lexicon`
# is named directly because `cranelift-codegen` does not re-export it and
# `isa::lookup` takes a `Triple` — the version is pinned to the one
# `cranelift-codegen` itself depends on, or `lookup` would be handed a `Triple`
# from a different crate and refuse it.
[dependencies]
# `x86` and `arm64` explicitly: cranelift's default `host-arch` builds only the
# backend of the machine it is compiled on, so a compiler built on x86_64 would
# answer `--target aarch64` with `SupportDisabled` — cross-compilation is spec
# §2, not an extra. The other two backends stay out; there are exactly two
# targets.
cranelift-codegen = { version = "0.134", features = ["x86", "arm64"] }
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
libwild = "0.10"
target-lexicon = "0.13.5"

# `liss-ir` is the input. `liss-runtime` comes with it, for `Roman`'s digits.
liss-ir = { path = "../liss-ir" }
liss-runtime = { path = "../liss-runtime" }

[build-dependencies]
# `build.rs` reads the cross-built `liss-abi` staticlib to discover which
# symbols the prelink must keep, and reads `crt1.o` to discover what the C
# runtime demands of it. Both lists were hand-written once and both were wrong;
# see the comments there.
object = { version = "0.40", default-features = false, features = ["read", "std", "archive", "elf"] }

[dev-dependencies]
# The tests parse the embedded blobs. Everything they assert — `main` calls the
# guard installer before `liss_initium`, `libc.a` really did get prelinked, the
# CRT objects are the right architecture — is a statement about the *shipped*
# bytes, not about the source they were built from.
object = { version = "0.40", default-features = false, features = ["read", "std", "elf"] }

# The same scratch-directory implementation `lingua-serpentis`'s test support uses, which this
# crate cannot import: 2026-08-09-test-harness-libraries-design.md §7.
tempfile = "3"

# `tests/salve.rs` compiles a real fixture, so it needs the front end that
# produces the IR. A dev-dependency, not a dependency: `lingua-serpentis` does
# not depend on this crate today, and when the CLI task makes it do so, only a
# dev-dependency cycle remains — which cargo permits and a normal one would not.
lingua-serpentis = { path = "../lingua-serpentis" }
